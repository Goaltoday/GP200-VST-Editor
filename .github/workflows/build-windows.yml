name: Build Windows VST3 and Standalone

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - "feature/**"

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify HOT1 sources
        shell: powershell
        run: |
          $cloneSource = Get-Content "source/libgp200/GP200SoundClone.cpp" -Raw
          $cloneHeader = Get-Content "source/libgp200/GP200SoundClone.h" -Raw
          $midiSource = Get-Content "source/libgp200/MidiConnection.cpp" -Raw
          if ($cloneSource -notmatch 'blob\[11\]\s*=\s*0xa1') {
            throw "HOT1 marker 0xA1 is missing from GP200SoundClone.cpp"
          }
          if ($cloneHeader -notmatch 'factoryAmpUploadHasHot1Marker') {
            throw "HOT1 verifier declaration is missing from GP200SoundClone.h"
          }
          if ($midiSource -notmatch '#include\s+"GP200EffectDatabase.h"') {
            throw "GP200EffectDatabase.h include is missing from MidiConnection.cpp"
          }
          if ($midiSource -notmatch 'HOT1 build mismatch') {
            throw "HOT1 runtime verifier is missing from MidiConnection.cpp"
          }
          if ($cloneSource -notmatch 'requestedDisplayName' -or
              $cloneSource -notmatch 'buildFactoryAmpRename' -or
              $cloneSource -notmatch '0xa2') {
            throw "HOT2 Factory AMP rename support is missing"
          }
          if ($cloneSource -notmatch 'container\[crcOffset\].*crc >> 8' -or
              $cloneSource -notmatch 'container\[crcOffset \+ 1\].*crc & 0xff') {
            throw "CRCBE Sound Clone conversion fix is missing"
          }

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Verify VST3 and Standalone
        shell: powershell
        run: |
          $vst = @(Get-ChildItem build -Recurse -Directory -Filter "*.vst3" | Where-Object { $_.FullName -match 'Release[\\/]VST3' })
          $exe = @(Get-ChildItem build -Recurse -File -Filter "*.exe" | Where-Object { $_.FullName -match 'Release[\\/]Standalone' })
          if ($vst.Count -eq 0 -or $exe.Count -eq 0) { throw "Missing VST3 or Standalone output" }

      - name: Upload VST3 and Standalone
        uses: actions/upload-artifact@v7
        with:
          name: GP200-VST-Windows-VST3-Standalone-Scene-Remote
          path: |
            build/**/*_artefacts/Release/VST3/*.vst3/**
            build/**/*_artefacts/Release/Standalone/*.exe
          if-no-files-found: error
          retention-days: 14

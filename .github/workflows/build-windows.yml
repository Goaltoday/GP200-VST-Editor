name: Build Windows VST3 + Standalone

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - "feature/**"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify HOT1/HOT2 sources
        shell: powershell
        run: |
          $cloneSource = Get-Content "source/libgp200/GP200SoundClone.cpp" -Raw
          $cloneHeader = Get-Content "source/libgp200/GP200SoundClone.h" -Raw
          $midiSource = Get-Content "source/libgp200/MidiConnection.cpp" -Raw
          if ($cloneSource -notmatch 'blob\[11\]\s*=\s*0xa1') {
            throw "HOT1 marker 0xA1 is missing from GP200SoundClone.cpp"
          }
          if ($cloneHeader -notmatch 'factoryAmpUploadHasHot1Marker') {
            throw "HOT1 verifier declaration is missing from GP200SoundClone.h"
          }
          if ($midiSource -notmatch '#include\s+"GP200EffectDatabase.h"') {
            throw "GP200EffectDatabase.h include is missing from MidiConnection.cpp"
          }
          if ($midiSource -notmatch 'HOT1 build mismatch') {
            throw "HOT1 runtime verifier is missing from MidiConnection.cpp"
          }
          if ($cloneSource -notmatch 'requestedDisplayName' -or
              $cloneSource -notmatch 'buildFactoryAmpRename' -or
              $cloneSource -notmatch '0xa2') {
            throw "HOT2 Factory AMP rename support is missing"
          }
          if ($cloneSource -notmatch 'container\[crcOffset\].*crc >> 8' -or
              $cloneSource -notmatch 'container\[crcOffset \+ 1\].*crc & 0xff') {
            throw "CRCBE Sound Clone conversion fix is missing"
          }

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Package VST3 and Standalone
        shell: powershell
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "GP200 VST.vst3" | Select-Object -First 1
          if (-not $plugin) { throw "The VST3 bundle was not generated." }
          $exe = Get-ChildItem -Path build -Recurse -File -Filter "GP200 VST.exe" |
            Where-Object { $_.FullName -match '\\Standalone\\' } | Select-Object -First 1
          if (-not $exe) { throw "The Standalone executable was not generated. Check FORMATS VST3 Standalone in CMakeLists.txt." }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse $plugin.FullName (Join-Path (Resolve-Path dist) "GP200 VST.vst3")
          Copy-Item $exe.FullName (Join-Path (Resolve-Path dist) "GP200 VST.exe")
          Compress-Archive -Path "dist\GP200 VST.vst3", "dist\GP200 VST.exe" -DestinationPath "GP200-VST-Windows-VST3-Standalone.zip" -Force
          Get-Item "GP200-VST-Windows-VST3-Standalone.zip" | Format-List Name,Length

      - name: Upload VST3 and Standalone bundle
        uses: actions/upload-artifact@v7
        with:
          name: GP200-VST-Windows-VST3-Standalone
          path: GP200-VST-Windows-VST3-Standalone.zip
          if-no-files-found: error
          retention-days: 14
